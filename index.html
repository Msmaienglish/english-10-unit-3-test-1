  <div class="hint">Các từ/cụm quan trọng xuất hiện trực tiếp trong bài. Em tự tra và điền nghĩa tiếng Việt vào cột bên phải trước khi đọc.</div>
  <div class="vgrid"><div class="vcell"><b>Từ / cụm từ</b></div><div class="vcell"><b>Nghĩa em tự tra</b></div>
  ${list.map((x,i)=>`<div class="vrow"><div class="vcell"><span class="vword">${esc(x[0])}</span> <span class="pos">(${esc(x[1])})</span></div><div class="vcell"><input class="vocab-input" data-vocab="${sec}-${i}" value="${esc(state.vocab[sec+'-'+i]||'')}" placeholder="Tự điền nghĩa..."></div></div>`).join('')}</div></div>`;
}
function qCard(q){
  return `<article class="qcard" id="q${q.n}" data-q="${q.n}">
  <div class="qhead"><div class="qnum">${q.stem}</div><span class="qbadge">Câu ${q.n} / 40</span></div>
  <div class="options" role="group" aria-label="Đáp án câu ${q.n}">
    ${Object.entries(q.options).map(([k,v])=>`<button class="option" data-choice="${k}" aria-label="Câu ${q.n} đáp án ${k}"><span class="letter">${k}.</span><span class="txt">${v}</span><span class="state-tag"></span></button>`).join('')}
  </div>
  <div class="feedback" aria-live="polite"></div>
  <div class="explain">${q.explanation}</div>
  <div class="qactions"><button class="smallbtn retry">↻ Làm lại câu này</button><button class="smallbtn primary next">Câu tiếp theo →</button></div>
  </article>`;
}
function render(){
  let h='';
  for(let sec=1;sec<=6;sec++){
    const qs=QUESTIONS.filter(q=>q.section===sec);
    if(sec===3){
      h+=`<section class="section ${sec===1?'active':''}" id="sec${sec}"><div class="arr-layout">
      <aside class="arr-guide"><h3>🧩 Questions 13–17</h3><p><b>${ARRANGEMENT_INSTRUCTION}</b></p><p class="note">Mẹo: theo dõi từ nối, đại từ quy chiếu, cặp hỏi–đáp và trình tự thời gian.</p></aside>
      <div class="questions">${qs.map(q=>qCard(q)).join('')}</div></div></section>`;
    } else {
      h+=`<section class="section ${sec===1?'active':''}" id="sec${sec}">${vocabBlock(sec)}<div class="split">
      <article class="passage">${SOURCES[String(sec)]||''}</article><div class="questions">${qs.map(q=>qCard(q)).join('')}</div></div></section>`;
    }
  }
  main.innerHTML=h; bind(); restore();
}
function bind(){
  document.querySelectorAll('.qcard').forEach(card=>{
    const n=+card.dataset.q;
    card.querySelectorAll('.option').forEach(b=>b.addEventListener('click',()=>answer(n,b.dataset.choice)));
    card.querySelector('.retry').addEventListener('click',()=>retry(n));
    card.querySelector('.next').addEventListener('click',()=>goNext(n));
  });
  document.querySelectorAll('.vocab-input').forEach(inp=>inp.addEventListener('input',()=>{state.vocab[inp.dataset.vocab]=inp.value;persist();}));
}
function answer(n,choice){
  if(state.answers[n])return;
  const q=QUESTIONS.find(x=>x.n===n),card=document.getElementById('q'+n),ok=choice===q.correct;
  state.answers[n]={choice,correct:ok}; if(state.first[n]===undefined)state.first[n]=ok;
  card.querySelectorAll('.option').forEach(b=>{b.disabled=true;const k=b.dataset.choice,t=b.querySelector('.state-tag');
    if(k===q.correct){b.classList.add('correct');t.textContent=k===choice?'✓ Đúng':'✓ Đáp án đúng';}
    else if(k===choice){b.classList.add('wrong');t.textContent='✕ Sai';}
    else b.classList.add('strike');
  });
  const fb=card.querySelector('.feedback');fb.className='feedback '+(ok?'good':'bad');
  fb.textContent=ok?'✓ Chính xác! Giỏi lắm, con cố lên!':'✕ Chưa chính xác! Đáp án đúng là '+q.correct+'.';
  card.querySelector('.explain').classList.add('open');card.querySelector('.qactions').classList.add('show');
  if(ok){ding();confetti(card);speak('Giỏi lắm, con cố lên!');}else{wrongTone();card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');speak('Ôi trời ơi, con đọc kỹ đáp án cho cô!');}
  updateStats();persist();
}
function retry(n){
  const card=document.getElementById('q'+n);delete state.answers[n];state.retries[n]=(state.retries[n]||0)+1;
  card.querySelectorAll('.option').forEach(b=>{b.disabled=false;b.classList.remove('correct','wrong','strike');b.querySelector('.state-tag').textContent='';});
  card.querySelector('.feedback').className='feedback';card.querySelector('.feedback').textContent='';
  card.querySelector('.explain').classList.remove('open');card.querySelector('.qactions').classList.remove('show');
  updateStats();persist();card.scrollIntoView({behavior:'smooth',block:'center'});
}
function goNext(n){
  const next=QUESTIONS.find(q=>q.n===n+1);if(!next)return submitBtn.scrollIntoView({behavior:'smooth'});
  const cur=QUESTIONS.find(q=>q.n===n);if(next.section!==cur.section)activate(next.section);
  setTimeout(()=>document.getElementById('q'+next.n).scrollIntoView({behavior:'smooth',block:'start'}),50);
}
function restore(){
  for(const [n,a] of Object.entries(state.answers)){
    const q=QUESTIONS.find(x=>x.n===+n),card=document.getElementById('q'+n);if(!q||!card)continue;
    card.querySelectorAll('.option').forEach(b=>{b.disabled=true;const k=b.dataset.choice,t=b.querySelector('.state-tag');
      if(k===q.correct){b.classList.add('correct');t.textContent=k===a.choice?'✓ Đúng':'✓ Đáp án đúng';}
      else if(k===a.choice){b.classList.add('wrong');t.textContent='✕ Sai';}else b.classList.add('strike');
    });
    const fb=card.querySelector('.feedback');fb.className='feedback '+(a.correct?'good':'bad');fb.textContent=a.correct?'✓ Chính xác!':'✕ Chưa chính xác! Đáp án đúng là '+q.correct+'.';
    card.querySelector('.explain').classList.add('open');card.querySelector('.qactions').classList.add('show');
  }
  studentName.value=state.name||'';studentClass.value=state.cls||'';updateStats();
}
function updateStats(){
  const done=Object.keys(state.first).length,correct=Object.values(state.first).filter(Boolean).length,wrong=done-correct,rate=done?Math.round(correct/done*100):0;
  sDone.textContent=done;sLeft.textContent=40-done;sCorrect.textContent=correct;sWrong.textContent=wrong;sRate.textContent=rate+'%';progress.style.width=(done/40*100)+'%';
}
function activate(sec){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById('sec'+sec).classList.add('active');document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',+t.dataset.sec===+sec));window.scrollTo({top:document.querySelector('.tabs').offsetTop-8,behavior:'smooth'})}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>activate(t.dataset.sec)));
function findFirst(fn){const q=QUESTIONS.find(fn);if(!q)return alert('Không có câu phù hợp.');activate(q.section);setTimeout(()=>document.getElementById('q'+q.n).scrollIntoView({behavior:'smooth',block:'center'}),80)}
unfinishedBtn.addEventListener('click',()=>findFirst(q=>state.first[q.n]===undefined));
wrongBtn.addEventListener('click',()=>findFirst(q=>state.first[q.n]===false));
submitBtn.addEventListener('click',()=>{
  const correct=Object.values(state.first).filter(Boolean).length,done=Object.keys(state.first).length,pct=Math.round(correct/40*100),score=(correct/40*10).toFixed(2).replace('.00','');
  const msg=pct>=90?'Con làm rất tốt! Hãy tiếp tục phát huy nhé!':pct>=70?'Con làm khá tốt! Hãy xem lại một vài câu nhé!':pct>=50?'Con đã có cố gắng! Hãy đọc kỹ phần giải thích và làm lại nhé!':'Không sao đâu! Con hãy bình tĩnh xem lại kiến thức và thử thêm lần nữa nhé!';
  submitBox.innerHTML=`<div class="scorebig">${score} / 10</div><p><b>${esc(state.name||'Học sinh')}</b>${state.cls?' • Lớp '+esc(state.cls):''}</p><p>Đã làm lần đầu: <b>${done}/40</b> • Đúng lần đầu: <b>${correct}</b> • Chưa làm: <b>${40-done}</b></p><p>${msg}</p><p class="note">Điểm giữ theo kết quả lần trả lời đầu tiên để sát cách làm bài trên giấy. Các lần “Làm lại câu này” chỉ phục vụ luyện tập.</p>`;
  submitBox.classList.add('show');submitBox.scrollIntoView({behavior:'smooth'});
});
saveIdentity.addEventListener('click',()=>{state.name=studentName.value.trim();state.cls=studentClass.value.trim();persist();});
studentName.addEventListener('change',()=>{state.name=studentName.value.trim();persist();});
studentClass.addEventListener('change',()=>{state.cls=studentClass.value.trim();persist();});
resetBtn.addEventListener('click',()=>{if(confirm('Làm lại toàn bộ? Kết quả hiện tại sẽ được xóa.')){state={answers:{},first:{},retries:{},name:studentName.value.trim(),cls:studentClass.value.trim(),vocab:state.vocab||{}};persist();render();activate(1);}});
clearBtn.addEventListener('click',()=>{if(confirm('Xóa toàn bộ dữ liệu đã lưu trên trình duyệt?')){localStorage.removeItem(KEY);state={answers:{},first:{},retries:{},name:'',cls:'',vocab:{}};render();activate(1);}});
soundBtn.addEventListener('click',()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'🔊 Âm thanh: Bật':'🔇 Âm thanh: Tắt';if(!soundOn&&'speechSynthesis'in window)speechSynthesis.cancel();persist();});
function persist(){localStorage.setItem(KEY,JSON.stringify({...state,soundOn}));}
function load(){
  const raw=localStorage.getItem(KEY);if(raw){try{const old=JSON.parse(raw);if(confirm('Phát hiện bài đang làm dở. Con có muốn tiếp tục không?')){state={answers:old.answers||{},first:old.first||{},retries:old.retries||{},name:old.name||'',cls:old.cls||'',vocab:old.vocab||{}};soundOn=old.soundOn!==false;}else localStorage.removeItem(KEY);}catch(e){}}
  soundBtn.textContent=soundOn?'🔊 Âm thanh: Bật':'🔇 Âm thanh: Tắt';
}
function speak(text){if(!soundOn||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='vi-VN';u.rate=.95;speechSynthesis.speak(u);}catch(e){}}
function actx(){return new (window.AudioContext||window.webkitAudioContext)();}
function ding(){if(!soundOn)return;try{const c=actx(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(660,c.currentTime);o.frequency.exponentialRampToValueAtTime(980,c.currentTime+.18);g.gain.setValueAtTime(.12,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.32);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.33);}catch(e){}}
function wrongTone(){if(!soundOn)return;try{const c=actx();[0,1,2].forEach(i=>{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*.14;o.type='triangle';o.frequency.value=[440,330,220][i];g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.001,t+.13);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.14);})}catch(e){}}
function confetti(card){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const r=card.getBoundingClientRect(),x=r.left+r.width/2,y=Math.min(r.top+100,innerHeight-80),colors=['#c92532','#ef6a72','#ffd6d9','#5fb77d','#ffffff'];for(let i=0;i<34;i++){const e=document.createElement('i');e.className='confetti';e.style.left=x+'px';e.style.top=y+'px';e.style.background=colors[i%colors.length];e.style.setProperty('--dx',(Math.random()*420-210)+'px');e.style.setProperty('--dy',(Math.random()*300-180)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),950)}}
load();render();
</script>
</body>
</html>
